version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      # The build toolchain churns constantly; batch it into one PR.
      build-toolchain:
        patterns:
          - "@babel/*"
          - "@wordpress/*"
          - "babel-*"
          - "grunt*"
          - "webpack*"
          - "*-loader"
          - "sass"
          - "autoprefixer"
          - "cross-env"
          - "mini-css-extract-plugin"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # jQuery and Select2 are compiled into the shipped admin bundle. Bumping
      # them changes distributed code, so review those deliberately rather than
      # in an automated PR.
      - dependency-name: "jquery"
      - dependency-name: "select2"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "build"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
